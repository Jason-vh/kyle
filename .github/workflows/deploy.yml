name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kyle-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_DIR: /home/exedev/apps/kyle

jobs:
  # The pre-commit hook runs the same checks but can be skipped, and runs the
  # database tests against pglite. Here they run against the Postgres the app
  # actually uses, and a failure stops the deploy rather than shipping.
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyle
          POSTGRES_PASSWORD: kyle
          POSTGRES_DB: kyle
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests read this rather than DATABASE_URL, so they can never be pointed
      # at a real database by accident.
      TEST_DATABASE_URL: postgresql://kyle:kyle@localhost:5432/kyle
      DATABASE_URL: postgresql://kyle:kyle@localhost:5432/kyle
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate

      - name: Format, lint, types and tests
        run: bun run check

      - name: Build the web app
        run: bun run build:web

  deploy:
    name: Deploy to exe.dev VM
    needs: check
    runs-on: [self-hosted, linux, kyle-prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write production env file
        run: |
          cat > .env.production <<EOF
          APP_URL=https://kyle.vhtm.eu
          WEBAUTHN_ORIGIN=https://kyle.vhtm.eu
          WEBAUTHN_RP_ID=kyle.vhtm.eu
          DATABASE_URL=postgresql://kyle:${{ secrets.KYLE_DB_PASSWORD }}@postgres:5432/kyle
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CHAT_API_KEY=${{ secrets.CHAT_API_KEY }}
          THREAD_VIEWER_TOKEN=${{ secrets.THREAD_VIEWER_TOKEN }}
          WEBHOOK_AUTH=${{ secrets.WEBHOOK_AUTH }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY=${{ secrets.BRAVE_API_KEY }}
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          RADARR_HOST=${{ secrets.RADARR_HOST }}
          RADARR_API_KEY=${{ secrets.RADARR_API_KEY }}
          SONARR_HOST=${{ secrets.SONARR_HOST }}
          SONARR_API_KEY=${{ secrets.SONARR_API_KEY }}
          TMDB_API_TOKEN=${{ secrets.TMDB_API_TOKEN }}
          QBITTORRENT_HOST=${{ secrets.QBITTORRENT_HOST }}
          QBITTORRENT_USERNAME=${{ secrets.QBITTORRENT_USERNAME }}
          QBITTORRENT_PASSWORD=${{ secrets.QBITTORRENT_PASSWORD }}
          ULTRA_HOST=${{ secrets.ULTRA_HOST }}
          ULTRA_API_TOKEN=${{ secrets.ULTRA_API_TOKEN }}
          PLEX_CLIENT_IDENTIFIER=${{ secrets.PLEX_CLIENT_IDENTIFIER }}
          PLEX_SERVER_URL=${{ secrets.PLEX_SERVER_URL }}
          PLEX_SERVER_TOKEN=${{ secrets.PLEX_SERVER_TOKEN }}
          KYLE_APP_HOST_PORT=3003
          COMPOSE_PROJECT_NAME=kyle
          DEPLOY_ID=${{ github.sha }}
          EOF

      - name: Copy checkout to stable deploy directory
        run: |
          rm -rf "$DEPLOY_DIR.tmp"
          mkdir -p "$DEPLOY_DIR.tmp"
          cp -a . "$DEPLOY_DIR.tmp/"
          rm -rf "$DEPLOY_DIR"
          mv "$DEPLOY_DIR.tmp" "$DEPLOY_DIR"

      - name: Build images
        run: |
          cd "$DEPLOY_DIR"
          docker compose --env-file .env.production build

      - name: Apply Drizzle migrations
        run: |
          cd "$DEPLOY_DIR"
          docker compose --env-file .env.production run --rm app bun run server/db/migrate.ts

      - name: Start app
        run: |
          cd "$DEPLOY_DIR"
          docker compose --env-file .env.production up -d --remove-orphans
          docker compose --env-file .env.production ps

      - name: Reload Caddy (picks up deploy/caddy.snippet)
        run: |
          sudo /usr/bin/caddy validate --config /etc/caddy/Caddyfile
          sudo /usr/bin/systemctl reload caddy

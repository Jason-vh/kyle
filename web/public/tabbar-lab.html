<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tab bar lab</title>
    <style>
      :root {
        --base: #f7f7f9;
        --surface: #ffffff;
        --elevated: #f1f2f4;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #8b93a1;
        --float:
          inset 0 1px 0 rgb(255 255 255 / 0.7), 0 0 0 1px rgb(17 24 39 / 0.08),
          0 8px 24px rgb(17 24 39 / 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --base: #0e1117;
          --surface: #161a22;
          --elevated: #1f242e;
          --border: #262c37;
          --text: #e8eaed;
          --muted: #6f7887;
          --float:
            inset 0 1px 0 rgb(255 255 255 / 0.04), 0 0 0 1px rgb(255 255 255 / 0.1),
            0 8px 24px rgb(0 0 0 / 0.5);
        }
      }
      html {
        background: var(--base);
        color-scheme: light dark;
      }
      body {
        margin: 0;
        color: var(--text);
        font:
          15px/1.5 system-ui,
          sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      main {
        padding: 16px 16px 112px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        padding: 8px 12px 12px;
      }
      legend {
        font-weight: 600;
        padding: 0 4px;
      }
      label {
        display: inline-flex;
        gap: 6px;
        margin: 4px 12px 4px 0;
      }
      .card {
        display: flex;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        padding: 16px;
      }
      .poster {
        width: 52px;
        height: 78px;
        border-radius: 6px;
        flex: none;
      }
      nav {
        position: fixed;
        z-index: 10;
        bottom: calc(0.75rem + env(safe-area-inset-bottom));
        display: flex;
        padding: 4px;
      }
      nav .material {
        position: absolute;
        inset: 0;
        z-index: -1;
      }
      nav a {
        flex: 1;
        text-align: center;
        padding: 14px 0;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <fieldset>
        <legend>Tab bar</legend>
        <div data-group="bar">
          <label><input type="radio" name="bar" value="shown" checked />Shown</label>
          <label><input type="radio" name="bar" value="hidden" />Hidden</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Shape</legend>
        <label
          ><input type="radio" name="shape" value="capsule" checked />Narrow capsule (now)</label
        >
        <label><input type="radio" name="shape" value="card" />Wide card (before)</label>
      </fieldset>
      <fieldset>
        <legend>Background</legend>
        <label><input type="radio" name="bg" value="elevated" checked />Elevated 85% (now)</label>
        <label><input type="radio" name="bg" value="surface" />Surface 80% (before)</label>
        <label><input type="radio" name="bg" value="none" />None</label>
      </fieldset>
      <fieldset>
        <legend>Backdrop filter</legend>
        <label
          ><input type="radio" name="blur" value="now" checked />Blur 24 + saturate (now)</label
        >
        <label><input type="radio" name="blur" value="before" />Blur 12 (before)</label>
        <label><input type="radio" name="blur" value="none" />None</label>
      </fieldset>
      <fieldset>
        <legend>Shadow</legend>
        <label><input type="radio" name="shadow" value="float" checked />Float (now)</label>
        <label><input type="radio" name="shadow" value="raised" />Raised + border (before)</label>
        <label><input type="radio" name="shadow" value="none" />None</label>
      </fieldset>
      <fieldset>
        <legend>Material on</legend>
        <label><input type="radio" name="host" value="child" checked />Child (now)</label>
        <label><input type="radio" name="host" value="nav" />Nav itself (before)</label>
      </fieldset>
      <div id="cards"></div>
    </main>

    <nav id="bar">
      <div class="material" id="material"></div>
      <a href="#">Home</a>
      <a href="#">Request</a>
      <a href="#">Library</a>
      <a href="#">Requests</a>
    </nav>

    <script>
      const colors = ["#c0392b", "#e67e22", "#2980b9", "#8e44ad", "#16a085"];
      document.getElementById("cards").innerHTML = Array.from(
        { length: 14 },
        (_, i) =>
          `<div class="card" style="margin-top:12px"><div class="poster" style="background:${colors[i % 5]}"></div><div><b>Title ${i + 1}</b><br><span style="color:var(--muted)">Series</span></div></div>`,
      ).join("");

      const bar = document.getElementById("bar");
      const material = document.getElementById("material");
      const value = (name) => document.querySelector(`input[name=${name}]:checked`).value;

      function apply() {
        const shape = value("shape");
        const host = value("host") === "nav" ? bar : material;
        const other = host === bar ? material : bar;

        bar.style.display = value("bar") === "hidden" ? "none" : "flex";
        bar.style.left = shape === "card" ? "12px" : "0";
        bar.style.right = shape === "card" ? "12px" : "0";
        bar.style.margin = shape === "card" ? "0" : "0 auto";
        bar.style.width = shape === "card" ? "auto" : "min(20rem, calc(100% - 3rem))";
        const radius = shape === "card" ? "14px" : "9999px";
        bar.style.borderRadius = radius;
        material.style.borderRadius = radius;

        for (const el of [bar, material]) {
          el.style.background = "none";
          el.style.boxShadow = "none";
          el.style.border = "none";
          el.style.backdropFilter = "none";
          el.style.webkitBackdropFilter = "none";
        }

        const bg = value("bg");
        if (bg === "elevated")
          host.style.background = "color-mix(in srgb, var(--elevated) 85%, transparent)";
        if (bg === "surface")
          host.style.background = "color-mix(in srgb, var(--surface) 80%, transparent)";

        const blur = value("blur");
        const filter = { now: "blur(24px) saturate(1.5)", before: "blur(12px)", none: "none" }[
          blur
        ];
        host.style.backdropFilter = filter;
        host.style.webkitBackdropFilter = filter;

        const shadow = value("shadow");
        if (shadow === "float") host.style.boxShadow = "var(--float)";
        if (shadow === "raised") {
          host.style.boxShadow = "0 4px 16px rgb(17 24 39 / 0.08)";
          host.style.border = "1px solid var(--border)";
        }
      }

      document.addEventListener("change", apply);
      apply();
    </script>
  </body>
</html>

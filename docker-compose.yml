services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${KYLE_APP_HOST_PORT:-3003}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyle
      POSTGRES_PASSWORD: ${KYLE_DB_PASSWORD:?}
      POSTGRES_DB: kyle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyle -d kyle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

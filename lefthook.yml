# The same checks CI runs, split so they run in parallel. CI is the backstop:
# this hook can be skipped with --no-verify, and skips the tests that need a
# database.
pre-commit:
  parallel: true
  commands:
    fmt:
      run: bun run fmt:check
    lint:
      run: bun run lint
    typecheck-server:
      run: bunx tsc --noEmit -p tsconfig.server.json
    typecheck-web:
      run: cd web && bunx vue-tsc --noEmit
    test:
      run: bun run test
    test-web:
      run: bun run test:web
